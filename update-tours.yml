name: Actualizar fechas

on:
  schedule:
    - cron: '0 * * * *'      # cada hora
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write             # commit de tours.json
  issues: write               # avisos por Issue

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leer u2.com y generar tours.json
        id: update
        env:
          NEW_DATES_FILE: new-dates.md     # dentro del workspace; no se hace commit de él
        run: node scripts/update-tours.js

      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain tours.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tours.json
            git commit -m "Actualizar fechas de la gira"
            git push
          else
            echo "Sin cambios"
          fi

      # Aviso 1: un Issue (GitHub te lo manda por email y a la app móvil de GitHub)
      - name: Avisar de fechas nuevas con un Issue
        if: steps.update.outputs.added != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "U2: ${{ steps.update.outputs.added }} fecha(s) nueva(s) en la gira" \
            --body-file new-dates.md

      # Aviso 2 (opcional): push al móvil con ntfy.sh. Solo si existe el secreto NTFY_TOPIC.
      - name: Avisar de fechas nuevas por ntfy
        if: steps.update.outputs.added != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -sS -H "Title: U2: ${{ steps.update.outputs.added }} fecha(s) nueva(s)" -H "Tags: guitar" \
              -H "Click: https://github.com/${{ github.repository }}/issues" \
              --data-binary @new-dates.md "https://ntfy.sh/$NTFY_TOPIC"
          else
            echo "NTFY_TOPIC no configurado, se omite"
          fi

      # Si el observer falla (u2.com bloquea, cambia el HTML...) no debe fallar en silencio.
      - name: Guardar la página descargada para diagnosticar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-fetch
          path: debug-fetch.html
          if-no-files-found: ignore

      - name: Avisar de que el observer ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          TITLE="U2 observer: fallo al actualizar las fechas"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Un solo Issue abierto a la vez, para no repetirlo cada hora
          if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" \
              --body "La comprobación horaria ha fallado, así que no se están detectando fechas nuevas. Revisa el log: $RUN_URL (si existe el artefacto debug-fetch, contiene la página que se descargó)."
            if [ -n "$NTFY_TOPIC" ]; then
              curl -sS -H "Title: U2 observer: fallo" -H "Tags: warning" -H "Click: $RUN_URL" \
                -d "Las comprobaciones de fechas están fallando" "https://ntfy.sh/$NTFY_TOPIC"
            fi
          else
            echo "Ya hay un Issue de fallo abierto"
          fi
