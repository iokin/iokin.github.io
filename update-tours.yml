name: Actualizar fechas

on:
  schedule:
    - cron: '0 * * * *'      # cada hora
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leer u2.com y generar tours.json
        run: node scripts/update-tours.js

      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain tours.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tours.json
            git commit -m "Actualizar fechas de la gira"
            git push
          else
            echo "Sin cambios"
          fi
